databaseChangeLog:
  - changeSet:
      id: 0-create-accounts-table
      author: asgartahmazov
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_accounts
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: numeric(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)

  - changeSet:
      id: 1-create-eventbox-table
      author: asgartahmazov
      changes:
        - createTable:
            tableName: eventbox
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_eventbox
                    nullable: false
              - column:
                  name: direction
                  type: boolean
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_eventbox
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamp
              - column:
                  name: retry_count
                  type: integer
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: error
                  type: text
              - column:
                  name: topic
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: key
                  type: varchar(255)
              - column:
                  name: payload
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: headers
                  type: jsonb
                  constraints:
                    nullable: false
