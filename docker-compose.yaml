x-postgres: &postgres
  image: postgres:18
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10

x-service: &service
  depends_on: &service-depends
    kafka:
      condition: service_healthy
  environment: &service-env
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  msfirstdb:
    <<: *postgres
    container_name: msfirstdb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: msfirstdb
      POSTGRES_USER: msfirstdb
      POSTGRES_PASSWORD: msfirstdb

  msseconddb:
    <<: *postgres
    container_name: msseconddb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: msseconddb
      POSTGRES_USER: msseconddb
      POSTGRES_PASSWORD: msseconddb

  msthirddb:
    <<: *postgres
    container_name: msthirddb
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: msthirddb
      POSTGRES_USER: msthirddb
      POSTGRES_PASSWORD: msthirddb

  ms-first:
    <<: *service
    build: ./ms-first
    container_name: ms-first
    ports:
      - "7352:7352"
    depends_on:
      <<: *service-depends
      msfirstdb:
        condition: service_healthy
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://msfirstdb:5432/msfirstdb

  ms-second:
    <<: *service
    build: ./ms-second
    container_name: ms-second
    ports:
      - "7353:7353"
    depends_on:
      <<: *service-depends
      msseconddb:
        condition: service_healthy
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://msseconddb:5432/msseconddb

  ms-third:
    <<: *service
    build: ./ms-third
    container_name: ms-third
    ports:
      - "7354:7354"
    depends_on:
      <<: *service-depends
      msthirddb:
        condition: service_healthy
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://msthirddb:5432/msthirddb
